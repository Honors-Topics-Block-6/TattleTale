# Include this file from redis.conf in production to keep active sessions recoverable.

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no

# Keep periodic snapshots for point-in-time fallback.
save 900 1
save 300 10
save 60 10000

# Ensure Redis can safely rewrite AOF in-place.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
